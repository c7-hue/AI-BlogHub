name: Deploy

on:
  push:
    branches: [main]   # 只有推到 main 分支才触发
  workflow_dispatch:   # 允许在 Actions 页面/ API 手动触发

# 同一时间只允许一个部署在跑;新 push 会自动取消还在跑的旧部署
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ① 云端构建前端(兼质检:TS 错误会让构建失败,坏代码到不了部署环节)
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ② 构建通过后,才执行部署
  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # 服务器同步最新代码,并用新代码重建 backend 镜像
      # 注意:只 docker build(构建镜像),绝不 docker compose up 仓库根 compose
      # —— 生产现役是 fastpath 四容器(fastpath/blog-deploy-kit/docker-compose.server.yml)
      - name: 服务器同步代码并重建 backend 镜像
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /www/AI-BlogHub
            git pull
            docker build -t ai-bloghub-backend:latest ./backend

      # 上传前端静态文件到 fastpath 的组装目录(rm 清掉旧 hash 文件再传)
      - name: 上传前端静态文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: /www/AI-BlogHub/fastpath/blog-deploy-kit/frontend-static/dist
          strip_components: 1
          rm: true

      # 快车道重建:frontend 装入新静态文件,backend 换用新镜像
      # —— 操作对象始终是 fastpath 自己的 compose,不会顶掉生产容器
      - name: 重启生产容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /www/AI-BlogHub/fastpath/blog-deploy-kit
            docker compose -f docker-compose.server.yml up -d --build frontend
            docker compose -f docker-compose.server.yml up -d backend
