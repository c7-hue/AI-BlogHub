name: Deploy

on:
  push:
    branches: [main]   # 只有推到 main 分支才触发
  workflow_dispatch:   # 允许在 Actions 页面/ API 手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 只同步代码,不做 docker compose up —— 生产现役是 fastpath 四容器
            # (fastpath/blog-deploy-kit/docker-compose.server.yml,含 ai-service)
            # 仓库根 compose 容器同名,在这里 up 会顶掉 fastpath,严禁
            cd /www/AI-BlogHub
            git pull
