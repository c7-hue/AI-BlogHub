# ========== 门 1:HTTP 一律跳转 HTTPS ==========
# http:// 的请求不服务任何内容,直接 301 永久重定向到 https://
server {
    listen 80;
    server_name zzlabai.top www.zzlabai.top blog.zzlabai.top;
    return 301 https://$host$request_uri;
}

# ========== 门 2:根域名 HTTPS ==========
# 域名证书在 /www/certs(服务器)→ 挂载为容器内 /etc/nginx/certs
server {
    listen 443 ssl;
    server_name zzlabai.top www.zzlabai.top;

    ssl_certificate     /etc/nginx/certs/zzlabai.top.pem;
    ssl_certificate_key /etc/nginx/certs/zzlabai.top.key;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 上传图片最大 20MB(不设的话 nginx 默认只放 1MB,上传会报 413)
    client_max_body_size 20m;

    # 根域名 = 个人主页(纯静态,构建时随镜像放在 /usr/share/nginx/homepage)
    location / {
        root /usr/share/nginx/homepage;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 根域名是纯主页,没有 /api/ 需要反代
}

# ========== 门 3:blog 子域名 HTTPS ==========
# 和门 2 唯一的区别:server_name 换成 blog,证书换成 blog 那对
server {
    listen 443 ssl;
    server_name blog.zzlabai.top www.blog.zzlabai.top;

    ssl_certificate     /etc/nginx/certs/blog.zzlabai.top.pem;
    ssl_certificate_key /etc/nginx/certs/blog.zzlabai.top.key;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
