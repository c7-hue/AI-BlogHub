server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 上传图片最大 20MB(不设的话 nginx 默认只放 1MB,上传会报 413)
    client_max_body_size 20m;

    # Vue 前端(history 路由必须配 try_files,否则刷新子页面会 404)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端接口:/api 前缀去掉后转发给 backend 容器的 3001 端口
    # (与开发时 vite.config.ts 里 proxy 的 rewrite 规则一致)
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 聊天是 SSE 流式响应,必须关缓冲,否则"打字机效果"会卡成一次性输出
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
